name: Generate 0A.m3u

on:
  schedule:
    - cron: '*/9 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate 0A.m3u
        run: |
          python 0A.py

      - name: Check for changes
        id: changes
        run: |
          if git status --short -- 0A.m3u | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "0A.m3u has changed."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "0A.m3u has not changed."
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "no2AZ4@users.noreply.github.com"

          git add 0A.m3u
          git commit -m "Update 0A.m3u"
          git push
